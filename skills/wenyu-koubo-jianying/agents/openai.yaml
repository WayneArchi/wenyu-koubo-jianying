interface:
  display_name: "wenyu-koubo-jianying"
  short_description: "口播先稿后剪，剪映识别字幕，按内容设计分层重点与章节包装"
  default_prompt: "使用 $wenyu-koubo-jianying 处理我的素材，先依据原片独立形成内容方案和留删理由，再做视觉包装；参考片仅供视觉样式，不决定主题时长顺序，已看参考不称严格盲测。复用确认状态，在剪映识别并批改字幕；原生确认新青年体或后现代体，字幕与标题不用系统默认。普通字幕固定白色#FFFFFF、13号、无描边、65%阴影，黄色#FFF598仅作标题/重点花字；遵守指定范围和检查点。"
